# wails3 dev configuration (Windows only). See ../README.md.
version: '3'

info:
  companyName: "Rechnungsarchiv"
  productName: "Rechnungsarchiv"
  productIdentifier: "at.rechnungsarchiv.gui"
  description: "Lokales Archiv für Rechnungen mit qualifiziertem Zeitstempel"
  copyright: "Apache-2.0"
  version: "0.1.0"

dev_mode:
  root_path: .
  log_level: warn
  debounce: 1000
  ignore:
    dir:
      - .git
      - node_modules
      - frontend
      - bin
      - screenshots
    file:
      - .DS_Store
      - .gitignore
      - .gitkeep
      - "*_test.go"
    watched_extension:
      - "*.go"
    git_ignore: true
  executes:
    - cmd: wails3 build DEV=true
      type: blocking
    - cmd: wails3 task dev:frontend
      type: background
    - cmd: wails3 task run
      type: primary
      exit_policy: shutdown
