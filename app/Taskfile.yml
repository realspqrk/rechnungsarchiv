# Tasks for the Wails v3 GUI (Windows). Run through the pinned CLI:
#   go install github.com/wailsapp/wails/v3/cmd/wails3@v3.1.0
#   wails3 build            # -> ../bin/rechnungsarchiv.exe (CLI + GUI) + ../bin/rechnungsarchiv-gui.exe (launcher)
#   wails3 dev              # live reload with Vite (build/config.yml)
#   wails3 task screenshots # -> screenshots/*.png (sample data)
#   wails3 task screenshots:real # -> screenshots/real-*.png (real service, test TSA)
version: '3'

vars:
  # One app binary for CLI and GUI (ADR-0008); the package app is the GUI.
  APP_NAME: rechnungsarchiv
  MAIN_PKG: '{{.ROOT_DIR}}/../cmd/rechnungsarchiv'
  LAUNCHER_PKG: '{{.ROOT_DIR}}/../cmd/rechnungsarchiv-gui'
  BIN_DIR: '{{.ROOT_DIR}}/../bin'
  VERSION: '{{.VERSION | default "0.1.0-dev"}}'
  VITE_PORT: '{{.WAILS_VITE_PORT | default 9245}}'

tasks:
  install:frontend:
    summary: Install frontend dependencies (exact versions from package-lock.json)
    dir: frontend
    sources: [package.json, package-lock.json]
    generates: [node_modules/.package-lock.json]
    cmds:
      - npm ci --no-audit --no-fund

  bindings:
    summary: Generate TypeScript bindings for the Shell service
    sources: ["*.go", "../go.mod", "../go.sum"]
    generates: ["frontend/bindings/**/*"]
    cmds:
      - wails3 generate bindings -clean=true -ts -i

  build:frontend:
    summary: Type-check and bundle the frontend into frontend/dist
    deps: [install:frontend, bindings]
    dir: frontend
    cmds:
      - npm test # pure text modules: src/unit.test.ts
      - npm run {{if eq .DEV "true"}}build:dev{{else}}build{{end}}

  syso:
    summary: Windows resources (icon, manifest, version info) for both executables
    dir: build
    cmds:
      - wails3 generate syso -arch {{ARCH}} -icon windows/icon.ico -manifest windows/wails.exe.manifest -info windows/info.json -out "{{.MAIN_PKG}}/wails_windows_{{ARCH}}.syso"
      - wails3 generate syso -arch {{ARCH}} -icon windows/icon.ico -manifest windows/wails.exe.manifest -info windows/info.json -out "{{.LAUNCHER_PKG}}/wails_windows_{{ARCH}}.syso"

  build:
    summary: Build rechnungsarchiv.exe (CLI + GUI) and the launcher rechnungsarchiv-gui.exe (DEV=true keeps devtools)
    deps:
      - task: build:frontend
        vars: { DEV: '{{.DEV}}' }
    cmds:
      - task: syso
      # A console program: the CLI. `gui`, or a start from Explorer without
      # arguments, releases the console and opens the window. Every export
      # bundles this binary as the verifier.
      - go build {{.BUILD_FLAGS}} -o "{{.BIN_DIR}}/{{.APP_NAME}}.exe" "{{.MAIN_PKG}}"
      # The Windows-subsystem launcher for shortcuts: no console flash.
      - go build -trimpath -buildvcs=false -ldflags="-w -s -H windowsgui" -o "{{.BIN_DIR}}/{{.APP_NAME}}-gui.exe" "{{.LAUNCHER_PKG}}"
      - cmd: powershell -NoProfile -Command "Remove-Item -ErrorAction SilentlyContinue '{{.MAIN_PKG}}/*.syso','{{.LAUNCHER_PKG}}/*.syso'"
        platforms: [windows]
    vars:
      VERSION_FLAG: -X github.com/realspqrk/rechnungsarchiv/internal/archive.Version={{.VERSION}}
      BUILD_FLAGS: '{{if eq .DEV "true"}}-buildvcs=false -gcflags=all="-l" -ldflags="{{.VERSION_FLAG}}"{{else}}-tags production -trimpath -buildvcs=false -ldflags="-w -s {{.VERSION_FLAG}}"{{end}}'
    env:
      CGO_ENABLED: 0

  run:
    summary: Open the window of the last build
    cmds:
      - '"{{.BIN_DIR}}/{{.APP_NAME}}.exe" gui'

  dev:frontend:
    summary: Vite dev server for wails3 dev
    deps: [install:frontend]
    dir: frontend
    cmds:
      - npm run dev -- --port {{.VITE_PORT}} --strictPort

  dev:
    summary: Live development (Go + Vite)
    cmds:
      - wails3 dev -config ./build/config.yml -port {{.VITE_PORT}}

  screenshots:
    summary: Screenshots of every screen and state with sample data
    deps: [build:frontend]
    dir: frontend
    cmds:
      - npm run screenshots

  screenshots:real:
    summary: Screenshots of the real service against a demo archive and the test TSA (real-*.png)
    deps: [build:frontend]
    cmds:
      - go test -tags testtsa -run TestRealScreenshots -count=1 -v .
    env:
      RA_REAL_SHOTS: '{{.ROOT_DIR}}/screenshots'

